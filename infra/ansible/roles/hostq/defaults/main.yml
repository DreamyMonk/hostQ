hostq_repo: "https://github.com/DreamyMonk/hostQ.git"
hostq_dir: "/opt/hostq"
hostq_version: "main"
hostq_panel_public_port: 8090
hostq_web_root: "/var/www"
hostq_panel_domain: ""
hostq_allow_insecure_http: true

hostq_create_swap: true
hostq_swap_size: "1G"

hostq_ufw_allowed_tcp:
  - "22"
  - "80"
  - "443"
  - "{{ hostq_panel_public_port }}"

hostq_base_packages:
  - ca-certificates
  - curl
  - git
  - gnupg
  - lsb-release
  - rsync
  - software-properties-common
  - ufw
  - unzip
