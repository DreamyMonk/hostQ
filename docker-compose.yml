services:
  panel:
    build: .
    container_name: hostq
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      - HOSTQ_ADDR=0.0.0.0:8090
      - HOSTQ_DATA_DIR=/data
      - WEB_ROOT=/var/www
      - JWT_SECRET=${JWT_SECRET:-change-this-secret}
    volumes:
      - hostq_data:/data
      - /var/www:/var/www

volumes:
  hostq_data:
